name: Release

on:
  workflow_dispatch:          # lets you start it by hand from the Actions tab (a dry run, no tag needed)
  push:
    tags: ["v*"]              # or runs when you push a tag like v0.1.0-test

permissions:
  contents: write             # needed to attach files to a Release

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: win64_msvc2022_64      # the Qt build that matches Visual Studio 2022

      - name: Build and test
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Collect the app and its Qt libraries
        shell: pwsh
        run: |
          mkdir dist/OneNode
          copy build/Release/appOneNode.exe dist/OneNode/
          copy build/Release/onenode-cli.exe dist/OneNode/
          windeployqt --release --qmldir qml dist/OneNode/appOneNode.exe
          windeployqt --release dist/OneNode/onenode-cli.exe
          Compress-Archive -Path dist/OneNode -DestinationPath OneNode-windows-x64.zip

      - uses: actions/upload-artifact@v4    # for dry runs: shows up on the run page
        with:
          name: OneNode-windows-x64
          path: OneNode-windows-x64.zip

      - uses: softprops/action-gh-release@v2   # only for tag pushes: attaches the zip to a Release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OneNode-windows-x64.zip
          prerelease: true